name: Publish Windows downloads
on:
  push:
    branches: [main]
    paths: [release.json, .github/workflows/release.yml, packages/SHA256SUMS.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify packages and test installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $expected = @("ReplayLite-$version-Setup-x64.exe", "ReplayLite-$version-Windows-x64.zip")
          $lines = @(Get-Content packages/SHA256SUMS.txt)
          if ($lines.Count -ne 2) { throw 'Expected two checksums' }
          foreach ($name in $expected) {
            $line = @($lines | Where-Object { $_ -match ('^[0-9a-f]{64}  ' + [regex]::Escape($name) + '$') })
            if ($line.Count -ne 1) { throw "Missing checksum: $name" }
            if ((Get-FileHash "packages/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $line[0].Substring(0,64)) { throw "Checksum failed: $name" }
          }
          $policy = [IO.File]::ReadAllBytes("$PWD/pending/update.txt")
          $signature = [IO.File]::ReadAllBytes("$PWD/pending/update.sig")
          $key = [Security.Cryptography.CngKey]::Import([IO.File]::ReadAllBytes("$PWD/update-public-key.bin"),[Security.Cryptography.CngKeyBlobFormat]::EccPublicBlob)
          $signer = [Security.Cryptography.ECDsaCng]::new($key)
          try {
            if (!$signer.VerifyData($policy,$signature,[Security.Cryptography.HashAlgorithmName]::SHA256)) { throw 'Update signature failed' }
          } finally { $signer.Dispose(); $key.Dispose() }
          $policyText = [Text.Encoding]::ASCII.GetString($policy)
          $setupHash = (Get-FileHash "packages/ReplayLite-$version-Setup-x64.exe").Hash.ToLowerInvariant()
          if ($policyText -notmatch ('\AReplayLite-update-1\nversion=' + [regex]::Escape($version) + '\nsha256=' + $setupHash + '\nemergency=[01]\n\z')) { throw 'Signed policy does not match installer' }
          $install = Join-Path $env:RUNNER_TEMP 'ReplayLite-install-test'
          $data = Join-Path $env:LOCALAPPDATA 'ReplayLite'
          New-Item -ItemType Directory -Force $data | Out-Null
          $ini = Join-Path $data 'ReplayLite.ini'
          @('[Config]', 'Version=3', '[Replay]', 'Seconds=150', '[Startup]', 'InstantReplay=0', '[Updates]', 'CheckAutomatically=0') | Set-Content $ini
          $before = (Get-FileHash $ini).Hash
          $recording = Join-Path $data 'Videos/keep-recording.txt'
          New-Item -ItemType Directory -Force (Split-Path $recording) | Out-Null
          'Preserve this recording' | Set-Content $recording
          $setup = Join-Path $PWD "packages/ReplayLite-$version-Setup-x64.exe"
          for ($i=0; $i -lt 2; $i++) {
            $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$install+'"')) -Wait -PassThru
            if ($p.ExitCode) { throw "Setup failed: $($p.ExitCode)" }
            if ((Get-FileHash $ini).Hash -ne $before) { throw 'Install/upgrade changed settings' }
            if ((Get-Item "$install/ReplayLite.exe").VersionInfo.ProductVersion -ne $version) { throw 'Installed version mismatch' }
            if (!(Test-Path "$install/category-rules.ini")) { throw 'Missing resources' }
            $p = Start-Process "$install/ReplayLite.exe" -ArgumentList '--quit' -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
            if ($p.ExitCode) { throw 'Installed executable did not load' }
          }
          $installedHash = (Get-FileHash "$install/ReplayLite.exe").Hash
          $p = Start-Process "$install/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -or (Test-Path "$install/ReplayLite.exe")) { throw 'Uninstall failed' }
          if ((Get-FileHash $ini).Hash -ne $before -or !(Test-Path $recording)) { throw 'Uninstall removed user data' }
          $portable = Join-Path $env:RUNNER_TEMP 'ReplayLite-zip-test'
          Expand-Archive "packages/ReplayLite-$version-Windows-x64.zip" $portable
          if ((Get-Item "$portable/ReplayLite.exe").VersionInfo.ProductVersion -ne $version) { throw 'ZIP version mismatch' }
          if ((Get-FileHash "$portable/ReplayLite.exe").Hash -ne $installedHash) { throw 'Installer and ZIP executables differ' }
          $p = Start-Process "$portable/ReplayLite.exe" -ArgumentList '--quit' -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($p.ExitCode) { throw 'ZIP executable did not load' }
          # Exercise the real updater against the previous public app in this disposable account.
          $old = Join-Path $env:RUNNER_TEMP 'ReplayLite-old'
          $cache = Join-Path $env:RUNNER_TEMP 'ReplayLite-update-cache'
          Invoke-WebRequest 'https://github.com/Havasiz/ReplayLite-Releases/releases/download/v0.3.2/ReplayLite-0.3.2-Windows-x64.zip' -OutFile "$env:RUNNER_TEMP/previous.zip"
          Expand-Archive "$env:RUNNER_TEMP/previous.zip" $old
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item "$portable/ReplayLiteUpdater.exe" "$cache/ReplayLiteUpdater.exe"
          Copy-Item pending/update.txt,pending/update.sig $cache
          Copy-Item $setup "$cache/setup.exe"
          # Start-Process -Wait also waits for descendants, including the restarted
          # recorder which should keep running. Wait for the helper itself only.
          $p = Start-Process "$cache/ReplayLiteUpdater.exe" -ArgumentList @(('"'+$cache+'"'),('"'+$old+'"'),'0','--test') -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill($true); throw 'Startup updater did not exit within 90 seconds' }
          $p.Refresh()
          if (Test-Path "$cache/updater-error.log") { Get-Content "$cache/updater-error.log" }
          if ($p.ExitCode) {
            if (Test-Path "$cache/installer.log") { Get-Content "$cache/installer.log" -Tail 30 }
            $detail = if (Test-Path "$cache/updater-error.log") { Get-Content "$cache/updater-error.log" -Raw } else { 'No error log' }
            throw "Startup updater failed: $detail"
          }
          if ((Get-Item "$old/ReplayLite.exe").VersionInfo.ProductVersion -ne $version) { throw 'Startup updater did not install new version' }
          Start-Sleep -Seconds 2
          $p = Start-Process "$old/ReplayLite.exe" -ArgumentList '--quit' -Wait -PassThru
          if ($p.ExitCode) { throw 'Updated app did not restart' }
          Start-Sleep -Seconds 2
          $p = Start-Process "$old/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode) { throw 'Updated app cleanup failed' }
          if ((Get-FileHash $ini).Hash -ne $before -or !(Test-Path $recording)) { throw 'Startup updater changed user data' }
      - name: Publish release and update feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('release.json', 'utf8'));
            const repo = context.repo, tag = `v${spec.version}`;
            const names = [`ReplayLite-${spec.version}-Setup-x64.exe`, `ReplayLite-${spec.version}-Windows-x64.zip`, 'SHA256SUMS.txt'];
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
              if (!release.draft) throw new Error(`${tag} already published; bump the version`);
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...repo, tag_name: tag, target_commitish: context.sha,
                name: `ReplayLite ${tag}`, draft: true, prerelease: spec.prerelease,
                body: fs.readFileSync('release-notes.md', 'utf8')})).data;
            }
            for (const name of names) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: existing.id});
              await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id, name, data: fs.readFileSync(`packages/${name}`)});
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, draft: false});
            // Publish the version and signed policy together, only after all assets exist.
            const head = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data.object.sha;
            const base = (await github.rest.git.getCommit({...repo, commit_sha: head})).data.tree.sha;
            const tree = [];
            for (const [name, data] of [['version.txt', Buffer.from(`${spec.version}\n`)], ['update.txt', fs.readFileSync('pending/update.txt')], ['update.sig', fs.readFileSync('pending/update.sig')]]) {
              const blob = (await github.rest.git.createBlob({...repo, content: data.toString('base64'), encoding: 'base64'})).data.sha;
              tree.push({path: name, mode: '100644', type: 'blob', sha: blob});
            }
            const built = (await github.rest.git.createTree({...repo, base_tree: base, tree})).data.sha;
            const commit = (await github.rest.git.createCommit({...repo, message: `Announce ReplayLite ${tag}`, tree: built, parents: [head]})).data.sha;
            await github.rest.git.updateRef({...repo, ref: 'heads/main', sha: commit});
